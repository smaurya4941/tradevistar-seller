appId: ${APP_ID}
name: "8. Reset a password, then sign in with the new one"
---
- runFlow: ../subflows/launch-clean.yaml
- tapOn:
    id: sign-in-forgot
- tapOn:
    id: forgot-identifier
- inputText: ${RESET_EMAIL}
- hideKeyboard
- tapOn:
    id: forgot-send
- extendedWaitUntil:
    visible:
      id: reset-code-input
    timeout: 10000
- runFlow:
    file: ../subflows/enter-code.yaml
    env:
      INPUT_ID: reset-code-input
      CODE: ${OTP_CODE}
# The sixth digit moves on to the new-password step by itself.
- extendedWaitUntil:
    visible:
      id: reset-password
    timeout: 10000
- tapOn:
    id: reset-password
- inputText: ${RESET_NEW_PASSWORD}
- tapOn:
    id: reset-confirm
- inputText: ${RESET_NEW_PASSWORD}
- hideKeyboard
- tapOn:
    id: reset-save
# Back at sign-in with the identifier filled in and the confirmation shown.
- extendedWaitUntil:
    visible:
      id: sign-in-notice
    timeout: 15000
- tapOn:
    id: sign-in-password
- inputText: ${RESET_NEW_PASSWORD}
- hideKeyboard
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 20000
