appId: ${APP_ID}
name: "1. Password sign-in, and the session survives a restart"
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow:
    file: ../subflows/signin-as.yaml
    env:
      EMAIL: ${SELLER_EMAIL}
      PASSWORD: ${SELLER_PASSWORD}
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 20000
# Force-stop and reopen: the Keychain session is restored with no sign-in.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 20000
- assertNotVisible:
    id: screen-sign-in
