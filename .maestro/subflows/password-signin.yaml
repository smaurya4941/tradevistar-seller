appId: ${APP_ID}
---
# From the sign-in screen: sign in with a password. Needs SELLER_EMAIL and SELLER_PASSWORD.
- tapOn:
    id: sign-in-identifier
- eraseText
- inputText: ${SELLER_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${SELLER_PASSWORD}
- hideKeyboard
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 20000
