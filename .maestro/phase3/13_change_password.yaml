appId: ${APP_ID}
name: "13. Change password; this phone stays signed in"
---
# PASSWORD_SELLER_EMAIL is a seller used only by this flow; the password becomes NEW_PASSWORD_VALUE.
- runFlow:
    file: ../subflows/open-profile.yaml
    env:
      EMAIL: ${PASSWORD_SELLER_EMAIL}
      PASSWORD: ${PASSWORD_SELLER_PASSWORD}
- tapOn:
    id: hub-security
- tapOn:
    id: sec-password
- extendedWaitUntil:
    visible:
      id: screen-change-password
    timeout: 15000
- tapOn:
    id: pw-current
- inputText: ${PASSWORD_SELLER_PASSWORD}
- tapOn:
    id: pw-new
- inputText: ${NEW_PASSWORD_VALUE}
- tapOn:
    id: pw-confirm
- inputText: ${NEW_PASSWORD_VALUE}
- hideKeyboard
- tapOn:
    id: form-save
- extendedWaitUntil:
    visible: "Password changed.*"
    timeout: 20000
# The session was renewed, not ended: the account screen still loads.
- tapOn:
    id: hub-account
- extendedWaitUntil:
    visible:
      id: screen-account
    timeout: 15000
