apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * Each flavor reads its own env file through react-native-config. Task names such as
 * `assembleStagingRelease` select the file by their flavor prefix.
 */
project.ext.envConfigFiles = [
    dev    : ".env.development",
    staging: ".env.staging",
    prod   : ".env.production",
]
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

react {
    autolinkLibrariesWithApp()
}

/**
 * Release signing comes from outside the repository: ~/.gradle/gradle.properties locally, or
 * environment variables in CI. Without them a release build falls back to the debug key, which
 * Play will reject, so a mis-configured pipeline cannot ship silently.
 */
def signingValue = { String name ->
    project.findProperty(name) ?: System.getenv(name)
}
def hasUploadKey = signingValue("TV_UPLOAD_STORE_FILE") != null

def enableProguardInReleaseBuilds = true

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.tradevistar.seller"
    defaultConfig {
        applicationId "com.tradevistar.seller"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        resValue "string", "build_config_package", "com.tradevistar.seller"
        // Host of the seller web portal, used by the Android App Links intent filter.
        manifestPlaceholders = [
            webHost: new URI(project.env.get("WEB_URL") ?: "https://seller.tradevistar.com").host,
            mapsApiKey: project.env.get("GOOGLE_MAPS_API_KEY") ?: "",
        ]
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions "environment"
    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "TradeVistar Seller Dev"
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            resValue "string", "app_name", "TradeVistar Seller Staging"
        }
        prod {
            dimension "environment"
            resValue "string", "app_name", "TradeVistar Seller"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasUploadKey) {
            release {
                storeFile file(signingValue("TV_UPLOAD_STORE_FILE"))
                storePassword signingValue("TV_UPLOAD_STORE_PASSWORD")
                keyAlias signingValue("TV_UPLOAD_KEY_ALIAS")
                keyPassword signingValue("TV_UPLOAD_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig hasUploadKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    // SMS User Consent (one-tap OTP autofill; no SMS permission). See sms/SmsConsentModule.kt.
    implementation("com.google.android.gms:play-services-auth-api-phone:18.1.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

/**
 * Firebase is configured per flavor with app/src/<flavor>/google-services.json (the package names
 * differ by suffix). Until those files exist the app still builds and runs; analytics simply
 * reports "not configured" on the Diagnostics screen.
 */
def hasGoogleServices = ["dev", "staging", "prod"].any { flavor ->
    file("src/${flavor}/google-services.json").exists()
} || file("google-services.json").exists()
if (hasGoogleServices) {
    apply plugin: "com.google.gms.google-services"
} else {
    logger.warn("google-services.json not found: building without Firebase configuration.")
}
